{% set version = "2.1.15" %}

package:
  name: pyglet
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pyglet/pyglet-{{ version }}.tar.gz
  sha256: 0ef34fe730808a97e48c24dd6ed4ff614024b980955ed8dbc2dd01ededaa08cb

build:
  number: 1
  script: {{ PYTHON }} -m pip install . -vv
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - flit-core
  run:
    - python >={{ python_min }}
    - freetype
    - ffmpeg >=4.0.0
    - __linux  # [linux]
    - __osx  # [osx]
    - __win  # [win]
    # pyglet dlopens the unversioned libGL.so, which only libgl-devel provides
    - libgl-devel  # [linux]

test:
  # All "import ..." tests live in `run_tests.py`. Imports that need a
  # display are skipped on Linux, so no (virtual) X server is required.
  requires:
    - libglu  # [linux]
    - python {{ python_min }}
    - pip
  files:
    - run_tests.py
  commands:
    - pip check
    - python run_tests.py

about:
  home: http://pyglet.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  dev_url: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hmaarrfk  # just a maintainer to help move things forward. Happy to retire myself
