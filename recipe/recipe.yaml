schema_version: 1

context:
  version: 2.1.19

package:
  name: pyglet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyglet/pyglet-${{ version }}.tar.gz
  sha256: 77fae024df940c60917ba604bab9b7e26306d66734186634b698c708cdd9f4be

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core >=3.2,<4
  run:
    - python >=${{ python_min }}
    - if: linux
      then: __linux
    - if: osx
      then: __osx
    - if: win
      then: __win
    # pyglet dlopens the unversioned libGL.so, which only libgl-devel provides
    - if: linux
      then: libgl-devel

tests:
  # All "import ..." tests live in `run_tests.py`. Imports that need a
  # display are skipped on Linux, so no (virtual) X server is required.
  - files:
      recipe:
        - run_tests.py
    requirements:
      run:
        - if: linux
          then: libglu
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check
      - python run_tests.py

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  homepage: http://pyglet.org
  repository: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hmaarrfk  # just a maintainer to help move things forward. Happy to retire myself
