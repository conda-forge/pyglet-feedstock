schema_version: 1

context:
  version: "2.1.15"

package:
  name: pyglet
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyglet/pyglet-${{ version }}.tar.gz
  sha256: 0ef34fe730808a97e48c24dd6ed4ff614024b980955ed8dbc2dd01ededaa08cb

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}
    - freetype
    # pyglet 2.1.x only knows the FFmpeg 4-8 library names (avutil-56 .. avutil-60)
    - ffmpeg >=4.0.0,<9
    - if: linux
      then: __linux
    - if: osx
      then: __osx
    - if: win
      then: __win
    # pyglet dlopens the unversioned libGL.so, which only libgl-devel provides
    - if: linux
      then: libgl-devel

tests:
  # All "import ..." tests live in `run_tests.py`. Imports that need a
  # display are skipped on Linux, so no (virtual) X server is required.
  - files:
      recipe:
        - run_tests.py
    requirements:
      run:
        - if: linux
          then: libglu
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check
      - python run_tests.py

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  homepage: http://pyglet.org
  repository: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hmaarrfk  # just a maintainer to help move things forward. Happy to retire myself

